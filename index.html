<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Language Translation Tool</title>

    <!-- CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <div class="header">
            <h1>🌐 Language Translation Tool</h1>
            <p>Translate text quickly and easily</p>
        </div>

        <div class="translation-box">

            <!-- Source Language -->
            <div class="language-section">

                <label for="sourceLanguage">
                    Source Language
                </label>

                <select id="sourceLanguage">

                    <option value="auto">Detect Language</option>

                    <option value="en">English</option>
                    <option value="hi">Hindi</option>
                    <option value="mr">Marathi</option>
                    <option value="gu">Gujarati</option>
                    <option value="bn">Bengali</option>
                    <option value="ta">Tamil</option>
                    <option value="te">Telugu</option>
                    <option value="kn">Kannada</option>
                    <option value="ml">Malayalam</option>
                    <option value="pa">Punjabi</option>

                    <option value="fr">French</option>
                    <option value="de">German</option>
                    <option value="es">Spanish</option>
                    <option value="it">Italian</option>
                    <option value="pt">Portuguese</option>
                    <option value="ru">Russian</option>
                    <option value="ja">Japanese</option>
                    <option value="ko">Korean</option>
                    <option value="zh-CN">Chinese</option>

                </select>

            </div>


            <!-- Target Language -->
            <div class="language-section">

                <label for="targetLanguage">
                    Target Language
                </label>

                <select id="targetLanguage">

                    <option value="en">English</option>
                    <option value="hi">Hindi</option>
                    <option value="mr">Marathi</option>
                    <option value="gu">Gujarati</option>
                    <option value="bn">Bengali</option>
                    <option value="ta">Tamil</option>
                    <option value="te">Telugu</option>
                    <option value="kn">Kannada</option>
                    <option value="ml">Malayalam</option>
                    <option value="pa">Punjabi</option>

                    <option value="fr">French</option>
                    <option value="de">German</option>
                    <option value="es">Spanish</option>
                    <option value="it">Italian</option>
                    <option value="pt">Portuguese</option>
                    <option value="ru">Russian</option>
                    <option value="ja">Japanese</option>
                    <option value="ko">Korean</option>
                    <option value="zh-CN">Chinese</option>

                </select>

            </div>


            <!-- Input -->
            <div class="text-section">

                <label for="inputText">
                    Enter Text
                </label>

                <textarea
                    id="inputText"
                    placeholder="Type or paste your text here..."
                    maxlength="5000"></textarea>

                <div class="character-count">
                    <span id="charCount">0</span> / 5000 characters
                </div>

            </div>


            <!-- Translate Button -->
            <button id="translateButton" class="translate-btn">

                <span id="buttonText">
                    Translate
                </span>

                <span id="loadingSpinner" class="spinner hidden"></span>

            </button>


            <!-- Output -->
            <div class="text-section output-section">

                <label for="translatedText">
                    Translated Text
                </label>

                <textarea
                    id="translatedText"
                    readonly
                    placeholder="Your translation will appear here..."></textarea>

            </div>


            <!-- Buttons -->
            <div class="action-buttons">

                <button id="copyButton" class="action-btn">
                    📋 Copy
                </button>

                <button id="speakButton" class="action-btn">
                    🔊 Speak
                </button>

                <button id="clearButton" class="action-btn">
                    🗑 Clear
                </button>

            </div>


            <!-- Status -->
            <div id="statusMessage" class="status-message"></div>

        </div>

    <footer>
        <p>
            Language Translation Tool |
            Built with Python, Flask & Google Translate
        </p>
    </footer>

</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
